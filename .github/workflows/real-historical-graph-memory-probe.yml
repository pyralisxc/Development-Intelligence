name: real-historical-graph-memory-probe
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - src/intelligence/repository.ts
      - .github/workflows/real-historical-graph-memory-probe.yml
permissions:
  contents: read
jobs:
  real-historical-cardforge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact DI candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Build actual DI runtime
        run: |
          npm ci --no-audit --no-fund
          npm run build:server:runtime
      - name: Check out real historical CardForge
        uses: actions/checkout@v7
        with:
          repository: pyralisxc/CardForge
          ref: 062169c45899bf408a9e46c515363c85d0f28736
          path: benchmark/cardforge-history
          persist-credentials: false
      - name: Construct complete real W with hosted-equivalent JavaScript heap
        shell: bash
        run: |
          node --max-old-space-size=1024 --input-type=module <<'JS'
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { buildRepositoryGraph } from './dist/src/intelligence/repository.js';
          const root = path.resolve('benchmark/cardforge-history');
          const sha = execFileSync('git',['-C',root,'rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const expected = '062169c45899bf408a9e46c515363c85d0f28736';
          if (sha !== expected) throw Error('Wrong benchmark source: '+sha);
          const start = Date.now();
          const g = await buildRepositoryGraph({
            project:'pyralisxc/CardForge',
            repository:'https://github.com/pyralisxc/CardForge.git',
            revision:sha,root,role:'W',
          });
          const c = g.coverage;
          if (!c || c.eligibleFiles !== c.analyzedFiles ||
            c.partialFiles || c.skippedFiles || c.failedFiles ||
            c.completeFiles !== c.eligibleFiles) {
            throw Error('Real source coverage incomplete: '+JSON.stringify(c));
          }
          const m = process.memoryUsage();
          const record = {
            revision:sha,analyzerVersion:g.analyzerVersion,graphId:g.graphId,
            sourceFingerprint:g.sourceFingerprint,
            topologyFingerprint:g.topologyFingerprint,
            evidenceFingerprint:g.evidenceFingerprint,
            explicitValueConflicts:g.explicitValueConflicts?.length??0,
            elapsedMs:Date.now()-start,trackedFiles:c.trackedFiles,
            eligibleFiles:c.eligibleFiles,completeFiles:c.completeFiles,
            skippedFiles:c.skippedFiles,failedFiles:c.failedFiles,
            nodes:g.nodes.length,edges:g.edges.length,evidence:g.evidence?.length??0,
            rssMiB:Math.round(m.rss/1048576),heapMiB:Math.round(m.heapUsed/1048576),
            peakRssMiB:Math.round(process.resourceUsage().maxRSS/1024)
          };
          console.log('REAL_HISTORICAL_GRAPH '+JSON.stringify(record));
          JS
      - name: Exercise real historical CardForge through ordinary DI MCP
        shell: bash
        run: |
          node --max-old-space-size=1024 --input-type=module <<'JS'
          import os from 'node:os';
          import path from 'node:path';
          import { promises as fs } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { pathToFileURL } from 'node:url';
          const root=path.resolve('benchmark/cardforge-history');
          const sha='062169c45899bf408a9e46c515363c85d0f28736';
          const actual=execFileSync('git',['-C',root,'rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(actual!==sha)throw Error('Wrong source identity');
          execFileSync('git',['-C',root,'update-ref','refs/heads/di380-history',sha]);
          const tmp=await fs.mkdtemp(path.join(os.tmpdir(),'di380-real-mcp-'));
          const cfg=path.join(tmp,'projects.json');
          await fs.writeFile(cfg,JSON.stringify({CardForge:{
            repository:pathToFileURL(path.join(root,'.git')).href,
            defaultRef:'refs/heads/di380-history',
            allowedRefs:['refs/heads/di380-history'],
            revisionPolicy:'repository-history',
            credential:{type:'none'},
          }}));
          process.env.DEVINT_PROJECTS_FILE=cfg;
          process.env.DEVINT_SCRATCH_DIR=path.join(tmp,'scratch');
          process.env.DEVINT_GRAPH_MAX_FILES='20000';
          process.env.DEVINT_GRAPH_MAX_FILE_BYTES='2000000';
          process.env.DEVINT_GRAPH_CACHE_SIZE='2';
          process.env.DEVINT_CANONICAL_GRAPH_DIR=path.join(tmp,'canonical');
          const {callTool}=await import('./dist/src/mcp.js');
          const started=Date.now();
          const scan=await callTool('scan_graph',{project:'CardForge',ref:'commit:'+sha});
          if(scan.revision!==sha||scan.coverage?.eligibleFiles!==scan.coverage?.completeFiles
             ||scan.coverage?.skippedFiles||scan.coverage?.failedFiles){
            throw Error('Historical MCP graph coverage not complete: '+JSON.stringify(scan.coverage));
          }
          const questions=[
            'Why does decideCatalogTrash reject expire?',
            'Under what conditions does resolveTemplatePipelineAttempt retry after the first await?',
            'What does decideCatalogTrash return?'
          ];
          const result=await callTool('investigate',{project:'CardForge',graphId:scan.graphId,questions});
          if(result.revision!==sha||result.items?.length!==questions.length||
              result.items.some(item=>item.status!=='ok')){
            throw Error('Real questions must finish on same historical graph: '+JSON.stringify(result.counts));
          }
          const mem=process.memoryUsage();
          console.log('REAL_HISTORICAL_MCP '+JSON.stringify({
            sha,graphId:scan.graphId,nodeCount:scan.nodeCount,edgeCount:scan.edgeCount,
            evidenceCount:scan.evidenceCount,coverage:scan.coverage,
            elapsedMs:Date.now()-started,
            questions:result.items.map(item=>({
              question:item.question,intent:item.intent,
              answerStatus:item.result?.status||item.status,
              answerPreview:String(item.answer||'').slice(0,240)
            })),
            heapUsedMiB:Math.round(mem.heapUsed/1048576),
            peakRssMiB:Math.round(process.resourceUsage().maxRSS/1024)
          }));
          JS

  baseline-heap-context:
    # Diagnostic comparison only; never use a failed old source head as a
    # reason to weaken today's graph completeness or a release gate.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out unchanged original Preview as comparison
        uses: actions/checkout@v7
        with:
          ref: 4c60904903a912ea3b0a29ff61cb1b3d798fa5c0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: |
          npm ci --no-audit --no-fund
          npm run build:server:runtime
      - name: Check out identical pinned CardForge
        uses: actions/checkout@v7
        with:
          repository: pyralisxc/CardForge
          ref: 062169c45899bf408a9e46c515363c85d0f28736
          path: benchmark/cardforge-history
          persist-credentials: false
      - name: Observe old source graph build, do not gate new candidate
        shell: bash
        continue-on-error: true
        run: |
          node --max-old-space-size=1024 --input-type=module <<'JS'
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {buildRepositoryGraph} from './dist/src/intelligence/repository.js';
          const root=path.resolve('benchmark/cardforge-history');
          const sha='062169c45899bf408a9e46c515363c85d0f28736';
          if(execFileSync('git',['-C',root,'rev-parse','HEAD'],{encoding:'utf8'}).trim()!==sha)throw Error('Wrong baseline source');
          const start=Date.now();
          const g=await buildRepositoryGraph({project:'pyralisxc/CardForge',
            repository:'https://github.com/pyralisxc/CardForge.git',revision:sha,root,role:'W'});
          const c=g.coverage;
          const m=process.memoryUsage();
          console.log('BASELINE_HISTORICAL_GRAPH '+JSON.stringify({
            sha,analyzerVersion:g.analyzerVersion,graphId:g.graphId,
            sourceFingerprint:g.sourceFingerprint,
            topologyFingerprint:g.topologyFingerprint,
            evidenceFingerprint:g.evidenceFingerprint,
            explicitValueConflicts:g.explicitValueConflicts?.length??0,
            elapsedMs:Date.now()-start,eligibleFiles:c?.eligibleFiles,
            completeFiles:c?.completeFiles,skippedFiles:c?.skippedFiles,
            failedFiles:c?.failedFiles,nodes:g.nodes.length,
            edges:g.edges.length,evidence:g.evidence?.length,
            rssMiB:Math.round(m.rss/1048576),
            heapMiB:Math.round(m.heapUsed/1048576),
            peakRssMiB:Math.round(process.resourceUsage().maxRSS/1024),
          }));
          JS
      - name: Verify original W fact identities with sufficient heap
        shell: bash
        run: |
          node --max-old-space-size=3072 --input-type=module <<'JS'
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {buildRepositoryGraph} from './dist/src/intelligence/repository.js';
          const root=path.resolve('benchmark/cardforge-history');
          const sha='062169c45899bf408a9e46c515363c85d0f28736';
          if(execFileSync('git',['-C',root,'rev-parse','HEAD'],{encoding:'utf8'}).trim()!==sha)throw Error('Wrong baseline source');
          const start=Date.now();
          const g=await buildRepositoryGraph({project:'pyralisxc/CardForge',
            repository:'https://github.com/pyralisxc/CardForge.git',revision:sha,root,role:'W'});
          const c=g.coverage;
          if (!c || c.eligibleFiles!==c.completeFiles || c.skippedFiles ||
            c.partialFiles || c.failedFiles) throw Error('Original graph coverage incomplete');
          const m=process.memoryUsage();
          console.log('BASELINE_RELAXED_HEAP_GRAPH '+JSON.stringify({
            sha,analyzerVersion:g.analyzerVersion,graphId:g.graphId,
            sourceFingerprint:g.sourceFingerprint,
            topologyFingerprint:g.topologyFingerprint,
            evidenceFingerprint:g.evidenceFingerprint,
            explicitValueConflicts:g.explicitValueConflicts?.length??0,
            elapsedMs:Date.now()-start,eligibleFiles:c?.eligibleFiles,
            completeFiles:c?.completeFiles,skippedFiles:c?.skippedFiles,
            failedFiles:c?.failedFiles,nodes:g.nodes.length,
            edges:g.edges.length,evidence:g.evidence?.length,
            rssMiB:Math.round(m.rss/1048576),
            heapMiB:Math.round(m.heapUsed/1048576),
            peakRssMiB:Math.round(process.resourceUsage().maxRSS/1024),
          }));
          JS
