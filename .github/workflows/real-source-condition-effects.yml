name: real-source-condition-effects
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "src/intelligence/sourceConditionEffects.ts"
      - "src/intelligence/workbench.ts"
      - "src/intelligence/assessment.ts"
      - "tests/source-condition-effects.test.ts"
      - "scripts/benchmark-source-condition-effects.mjs"
      - ".github/workflows/real-source-condition-effects.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: di-source-conditions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-conditions:
    name: exact-source-conditions (${{ matrix.source }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        source: [di, cardforge]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pinned read-only CardForge source
        if: matrix.source == 'cardforge'
        uses: actions/checkout@v7
        with:
          repository: pyralisxc/CardForge
          ref: 0e86857cedfc14cf7c3d12ce4df00d20909c637c
          persist-credentials: false
          path: benchmark/cardforge
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Compile canonical source understanding
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify actual source guards, effects and altered-guard oracle
        shell: bash
        env:
          SOURCE_KIND: ${{ matrix.source }}
        run: |
          set -euo pipefail
          node --max-old-space-size=4096 scripts/benchmark-source-condition-effects.mjs \
            --source "$SOURCE_KIND"
      - name: Preserve bounded measurements, no source or credentials
        uses: actions/upload-artifact@v4
        with:
          name: condition-effects-${{ matrix.source }}
          path: condition-effects-${{ matrix.source }}.json
          retention-days: 3
          if-no-files-found: error
