name: apply-compiler-fix

on:
  push:
    branches: [feat/stable-entity-parity-hardening]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate and apply bounded compiler patch
        run: |
          test -f .build/compiler-fix.patch
          grep '^--- a/' .build/compiler-fix.patch | sort -u > /tmp/paths
          cat > /tmp/expected <<'EOF'
          --- a/src/intelligence/repository.ts
          --- a/src/mcp.ts
          EOF
          sed -i 's/^          //' /tmp/expected
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/paths
          # The generated unified diff ends with a context-only blank line. Preserve
          # that line explicitly because the connector normalizes trailing whitespace.
          printf ' \n' >> .build/compiler-fix.patch
          git apply --check .build/compiler-fix.patch
          git apply .build/compiler-fix.patch
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify patched candidate before commit
        run: npm run verify
      - name: Commit verified compiler fixes and remove bridge
        run: |
          rm -f .build/compiler-fix.patch .github/workflows/apply-compiler-fix.yml
          rmdir .build 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/intelligence/repository.ts src/mcp.ts .build .github/workflows/apply-compiler-fix.yml
          git commit -m "fix: satisfy strict v2 graph contracts"
          git push origin HEAD:feat/stable-entity-parity-hardening
