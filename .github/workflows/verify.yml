name: verify

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: Verify accepted graph on main
        if: github.event_name == 'push'
        run: |
          if [ -f .development-intelligence/manifest.json ]; then
            npm run graph:check -- --repo-path "$GITHUB_WORKSPACE" --project Development-Intelligence
          fi

  self-seal:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'seal-b')
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Seal candidate B from exact PR head
        run: |
          node dist/src/graphCli.js seal --repo-path "$GITHUB_WORKSPACE" --project Development-Intelligence
          node dist/src/graphCli.js check --repo-path "$GITHUB_WORKSPACE" --project Development-Intelligence
      - name: Commit sealed B when changed
        run: |
          if [ -n "$(git status --porcelain -- .development-intelligence)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .development-intelligence
            git commit -m "chore: seal Development Intelligence graph B"
            node dist/src/graphCli.js check --repo-path "$GITHUB_WORKSPACE" --project Development-Intelligence
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "Sealed B is already current."
          fi
      - name: Upload sealed B evidence
        uses: actions/upload-artifact@v4
        with:
          name: development-intelligence-sealed-b
          path: .development-intelligence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  cardforge-benchmark:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARDFORGE_BENCHMARK_SHA: dad315ada5f538ba72a84d650811bb4b5fe95657
      CARDFORGE_BENCHMARK_ORACLE_PATH: benchmark/cardforge-oracle/docs/generated/product-reality.ndjson
      CARDFORGE_REQUIRE_FULL_ORACLE_PARITY: '1'
    steps:
      - name: Check out Development Intelligence candidate
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Check out final CardForge migration target
        uses: actions/checkout@v7
        with:
          repository: pyralisxc/CardForge
          ref: dad315ada5f538ba72a84d650811bb4b5fe95657
          path: benchmark/cardforge
          persist-credentials: false
      - name: Check out accepted Product Reality migration oracle
        uses: actions/checkout@v7
        with:
          repository: pyralisxc/CardForge
          ref: 6d6788cf87dd37d7685d26fa10a15e06fa1208ba
          path: benchmark/cardforge-oracle
          persist-credentials: false
      - name: Generate disposable W and require complete semantic migration parity
        run: |
          node scripts/benchmark-cardforge.mjs benchmark/cardforge
          cat benchmark-cardforge.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: cardforge-development-intelligence-benchmark
          path: |
            benchmark-cardforge.json
            benchmark-cardforge.md
          if-no-files-found: error
          retention-days: 14
