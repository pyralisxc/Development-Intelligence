name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: Verify committed Development Intelligence graph when present
        run: |
          if [ -f .development-intelligence/graph.ndjson ]; then
            npm run graph:check -- --repo-path "$GITHUB_WORKSPACE" --project Development-Intelligence
          fi
