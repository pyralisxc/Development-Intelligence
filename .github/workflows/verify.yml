name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: Verify committed Development Intelligence graph when present
        run: |
          if [ -f .development-intelligence/manifest.json ]; then
            npm run graph:check -- --repo-path "$GITHUB_WORKSPACE" --project Development-Intelligence
          fi

  self-seal:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Seal candidate B from exact PR head
        run: |
          node dist/src/graphCli.js seal --repo-path "$GITHUB_WORKSPACE" --project Development-Intelligence
          node dist/src/graphCli.js check --repo-path "$GITHUB_WORKSPACE" --project Development-Intelligence
      - name: Upload sealed B
        uses: actions/upload-artifact@v4
        with:
          name: development-intelligence-sealed-b
          path: .development-intelligence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  cardforge-benchmark:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARDFORGE_BENCHMARK_SHA: 6d6788cf87dd37d7685d26fa10a15e06fa1208ba
    steps:
      - name: Check out Development Intelligence candidate
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Check out pinned CardForge benchmark target
        uses: actions/checkout@v7
        with:
          repository: pyralisxc/CardForge
          ref: 6d6788cf87dd37d7685d26fa10a15e06fa1208ba
          path: benchmark/cardforge
          persist-credentials: false
      - name: Generate disposable W and run representative agent probes
        run: |
          node scripts/benchmark-cardforge.mjs benchmark/cardforge
          cat benchmark-cardforge.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: cardforge-intrinsic-graph-benchmark
          path: |
            benchmark-cardforge.json
            benchmark-cardforge.md
          if-no-files-found: error
          retention-days: 14
