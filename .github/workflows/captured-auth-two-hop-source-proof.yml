name: captured-auth-two-hop-source-proof
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/intelligence/conditionalCallComposition.ts"
      - "src/intelligence/exactConditionalGuard.ts"
      - "src/mcp.ts"
      - "scripts/benchmark-captured-auth-two-hop.mjs"
      - ".github/workflows/captured-auth-two-hop-source-proof.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: di-two-hop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-di-two-hop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:server
      - name: Real exact-Git authorization chain with negative controls
        env:
          EXACT_DI_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --max-old-space-size=4096 scripts/benchmark-captured-auth-two-hop.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: captured-auth-two-hop-proof
          path: captured-auth-two-hop-proof.json
          retention-days: 3
          if-no-files-found: error
