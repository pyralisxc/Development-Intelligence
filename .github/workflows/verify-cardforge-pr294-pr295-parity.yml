name: verify-cardforge-pr294-pr295-parity

on:
  push:
    branches: [feat/stable-entity-parity-hardening]

permissions:
  contents: read

jobs:
  parity-294-295:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Development Intelligence candidate
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Check out CardForge PR 295 candidate
        uses: actions/checkout@v7
        with:
          repository: pyralisxc/CardForge
          ref: dad315ada5f538ba72a84d650811bb4b5fe95657
          path: benchmark/cardforge-parity
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare exact PR 294 and PR 295 refs
        run: |
          git -C benchmark/cardforge-parity fetch origin main feat/development-intelligence-semantic-migration --force
          git -C benchmark/cardforge-parity cat-file -e bd2ed93f7746df6fcc1fc7b88f63f5ee798a4084^{commit}
          git -C benchmark/cardforge-parity cat-file -e dad315ada5f538ba72a84d650811bb4b5fe95657^{commit}
          git -C benchmark/cardforge-parity update-ref refs/heads/devint-pr294 bd2ed93f7746df6fcc1fc7b88f63f5ee798a4084
          git -C benchmark/cardforge-parity update-ref refs/heads/devint-pr295 dad315ada5f538ba72a84d650811bb4b5fe95657
      - name: Run DI parity and full graph differentials
        env:
          DEVINT_GRAPH_MAX_FILES: '20000'
          DEVINT_GRAPH_MAX_FILE_BYTES: '2000000'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { pathToFileURL } = require('node:url');

          (async () => {
            const root = path.resolve('benchmark/cardforge-parity');
            const temp = fs.mkdtempSync(path.join(os.tmpdir(), 'devint-pr294-pr295-'));
            const configPath = path.join(temp, 'projects.json');
            fs.writeFileSync(configPath, JSON.stringify({
              CardForge: {
                repository: pathToFileURL(path.join(root, '.git')).href,
                defaultRef: 'refs/heads/devint-pr295',
                allowedRefs: ['refs/heads/devint-pr294', 'refs/heads/devint-pr295'],
                credential: { type: 'none' }
              }
            }, null, 2));
            process.env.DEVINT_PROJECTS_FILE = configPath;
            process.env.DEVINT_SCRATCH_DIR = path.join(temp, 'scratch');
            process.env.DEVINT_GRAPH_CACHE_SIZE = '4';

            const { callTool } = await import('./dist/src/mcp.js');
            const baseRef = 'refs/heads/devint-pr294';
            const ref = 'refs/heads/devint-pr295';
            const [baseParity, headParity, parityDiff, graphDiff] = await Promise.all([
              callTool('scan_parity', { project: 'CardForge', ref: baseRef }),
              callTool('scan_parity', { project: 'CardForge', ref }),
              callTool('diff_parity', { project: 'CardForge', baseRef, ref }),
              callTool('diff_graph', { project: 'CardForge', baseRef, ref })
            ]);

            const summarize = (diff) => ({
              nodes: {
                added: diff.nodes?.added?.length ?? 0,
                removed: diff.nodes?.removed?.length ?? 0,
                changed: diff.nodes?.changed?.length ?? 0
              },
              edges: {
                added: diff.edges?.added?.length ?? 0,
                removed: diff.edges?.removed?.length ?? 0,
                changed: diff.edges?.changed?.length ?? 0
              }
            });
            const result = {
              base: { pr: 294, sha: 'bd2ed93f7746df6fcc1fc7b88f63f5ee798a4084', parity: baseParity },
              head: { pr: 295, sha: 'dad315ada5f538ba72a84d650811bb4b5fe95657', parity: headParity },
              paritySummary: summarize(parityDiff),
              graphSummary: summarize(graphDiff),
              parityDiff,
              graphDiff
            };
            fs.writeFileSync('parity-pr294-pr295.json', JSON.stringify(result, null, 2));

            const p = result.paritySummary;
            const g = result.graphSummary;
            const lines = [
              '# Development Intelligence: CardForge PR #294 → PR #295',
              '',
              `- Base: PR #294 merged commit \`${result.base.sha}\``,
              `- Head: PR #295 candidate \`${result.head.sha}\``,
              `- PR #294 semantic graph: **${baseParity.semanticNodeCount} nodes / ${baseParity.semanticEdgeCount} relationships**`,
              `- PR #295 semantic graph: **${headParity.semanticNodeCount} nodes / ${headParity.semanticEdgeCount} relationships**`,
              '',
              '## Parity lens differential',
              `- Nodes: **+${p.nodes.added} / -${p.nodes.removed} / ~${p.nodes.changed}**`,
              `- Relationships: **+${p.edges.added} / -${p.edges.removed} / ~${p.edges.changed}**`,
              '',
              '## Full canonical graph differential',
              `- Nodes: **+${g.nodes.added} / -${g.nodes.removed} / ~${g.nodes.changed}**`,
              `- Relationships: **+${g.edges.added} / -${g.edges.removed} / ~${g.edges.changed}**`,
              '',
              '## Sample parity changes',
              ...((parityDiff.nodes?.added ?? []).slice(0, 12).map(n => `- added node: \`${n.id}\``)),
              ...((parityDiff.nodes?.removed ?? []).slice(0, 12).map(n => `- removed node: \`${n.id}\``)),
              ...((parityDiff.nodes?.changed ?? []).slice(0, 12).map(n => `- changed node: \`${n.after?.id ?? n.before?.id}\``)),
              ...((parityDiff.edges?.added ?? []).slice(0, 12).map(e => `- added relationship: \`${e.id}\``)),
              ...((parityDiff.edges?.removed ?? []).slice(0, 12).map(e => `- removed relationship: \`${e.id}\``)),
              ...((parityDiff.edges?.changed ?? []).slice(0, 12).map(e => `- changed relationship: \`${e.after?.id ?? e.before?.id}\``))
            ];
            fs.writeFileSync('parity-pr294-pr295.md', lines.join('\n') + '\n');
            console.log(lines.join('\n'));
            fs.rmSync(temp, { recursive: true, force: true });
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: cardforge-pr294-pr295-parity
          path: |
            parity-pr294-pr295.json
            parity-pr294-pr295.md
          if-no-files-found: error
          retention-days: 7
