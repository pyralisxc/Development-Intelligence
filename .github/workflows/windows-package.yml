name: windows-package
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [preview]
permissions:
  contents: read
concurrency:
  group: windows-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-lifecycle:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare pinned MSI compiler in disposable runner
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Build unsigned Windows package
        shell: pwsh
        run: ./packaging/windows/Build-Package.ps1 -MsiVersion 2.9.237
      - name: Build and install local Windows distribution
        shell: pwsh
        run: |
          ./packaging/windows/Build-LocalPackage.ps1
          $bundle = Join-Path $PWD '.package-build/local-windows/Development-Intelligence-Local'
          & "$bundle/Install-Local.ps1" -RepoPath "$env:GITHUB_WORKSPACE" -Project di-windows -InstallDir "$env:RUNNER_TEMP/di-local" -DataDir "$env:RUNNER_TEMP/di-data" -ScratchDir "$env:RUNNER_TEMP/di-scratch" -DesktopDir "$env:RUNNER_TEMP/di-shortcuts" -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/di-local/di-local.cmd" history
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/di-local/di-local.cmd" build-revision --ref origin/main --target main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/di-local/di-local.cmd" build-revision --ref origin/preview --target preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/di-local/di-local.cmd" compare --limit 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve exact Windows package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-trial-UNSIGNED-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .package-build/**/*.msi
            .package-build/**/*.msi.json
            .package-build/**/manifest.json
            .package-build/**/Package.wxs
            .package-build/*/operator/**
            .package-build/*.json
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
      - name: Preserve local Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: development-intelligence-local-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: .package-build/local-windows/*.zip
          retention-days: 7
          if-no-files-found: error
