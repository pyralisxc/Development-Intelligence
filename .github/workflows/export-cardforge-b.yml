name: export-cardforge-development-intelligence-b

on:
  push:
    branches: [feat/stable-entity-parity-hardening]

permissions:
  contents: read

jobs:
  export-cardforge-b:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Development Intelligence candidate
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Check out exact committed CardForge candidate
        uses: actions/checkout@v7
        with:
          repository: pyralisxc/CardForge
          ref: c300662837b259cc04d326ccdba78a06f564f740
          path: benchmark/cardforge-candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify committed CardForge B is current and self-excluding
        run: |
          node dist/src/graphCli.js check --repo-path benchmark/cardforge-candidate --project CardForge
          cp benchmark/cardforge-candidate/.development-intelligence/manifest.json manifest-before.json
          node dist/src/graphCli.js seal --repo-path benchmark/cardforge-candidate --project CardForge
          cmp manifest-before.json benchmark/cardforge-candidate/.development-intelligence/manifest.json
          node dist/src/graphCli.js check --repo-path benchmark/cardforge-candidate --project CardForge
          git -C benchmark/cardforge-candidate diff --exit-code -- .development-intelligence
      - name: Upload verified CardForge B
        uses: actions/upload-artifact@v4
        with:
          name: cardforge-development-intelligence-b-verified
          path: benchmark/cardforge-candidate/.development-intelligence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
