name: twohop-real-source-proof
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "src/intelligence/twoHopSourceComposition.ts"
      - "scripts/benchmark-twohop-real-source.mjs"
      - ".github/workflows/twohop-real-source-proof.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  exact-di-twohop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:server
      - name: Verify real DI source and canonical graph two-hop conditions
        run: node scripts/benchmark-twohop-real-source.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: twohop-real-source-evidence
          path: twohop-real-source-evidence.json
          retention-days: 7
          if-no-files-found: error
