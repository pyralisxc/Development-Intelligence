name: Development Intelligence
description: Analyze a caller repository without owning its semantics, or use legacy check/seal checkpoint compatibility during migration.

inputs:
  project:
    description: Stable project identifier recorded in graph operations.
    required: true
  mode:
    description: analyze performs checkpointless read-only analysis; check/seal are legacy checkpoint migration modes. The action never commits or pushes.
    required: false
    default: check

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
    - name: Install Development Intelligence
      run: npm ci --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH"
      shell: bash
    - name: Build Development Intelligence
      run: npm run build --prefix "$GITHUB_ACTION_PATH"
      shell: bash
    - name: Run Development Intelligence operation
      run: |
        set -euo pipefail
        case "$DEVINT_CHECKPOINT_MODE" in
          analyze|check|seal) ;;
          *) echo "mode must be analyze, check, or seal" >&2; exit 2 ;;
        esac
        node "$GITHUB_ACTION_PATH/dist/src/graphCli.js" "$DEVINT_CHECKPOINT_MODE" \
          --repo-path "$GITHUB_WORKSPACE" \
          --project "$DEVINT_PROJECT"
      shell: bash
      env:
        DEVINT_CHECKPOINT_MODE: ${{ inputs.mode }}
        DEVINT_PROJECT: ${{ inputs.project }}
